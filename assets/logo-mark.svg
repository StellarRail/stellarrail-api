<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#070C1B" />
      <stop offset="100%" stop-color="#02050D" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.7" />
    </linearGradient>

    <!-- Primary Rail Gradient (Cyan to Cobalt) -->
    <linearGradient id="railCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Star Radiant Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas with Double Precision Border -->
  <rect x="10" y="10" width="492" height="492" rx="112" fill="url(#bg)" stroke="url(#rim)" stroke-width="3.5" />
  <rect x="22" y="22" width="468" height="468" rx="100" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.2" stroke-dasharray="8 8" />

  <!-- Subtle Architectural Blueprint Grid (Fintech Infrastructure) -->
  <g opacity="0.14" stroke="#38BDF8" stroke-width="1">
    <line x1="128" y1="44" x2="128" y2="468" stroke-dasharray="4 6" />
    <line x1="256" y1="44" x2="256" y2="468" stroke-dasharray="4 6" />
    <line x1="384" y1="44" x2="384" y2="468" stroke-dasharray="4 6" />
    <line x1="44" y1="128" x2="468" y2="128" stroke-dasharray="4 6" />
    <line x1="44" y1="256" x2="468" y2="256" stroke-dasharray="4 6" />
    <line x1="44" y1="384" x2="468" y2="384" stroke-dasharray="4 6" />
    <circle cx="256" cy="256" r="168" fill="none" stroke-dasharray="4 8" />
  </g>

  <!-- Central Star Glow Atmosphere -->
  <circle cx="256" cy="256" r="148" fill="url(#starGlow)" />

  <!-- Dual Sweeping Kinetic Rails (Upper Track) -->
  <path d="M 104 214 L 206 122 L 306 122 L 408 214" fill="none" stroke="url(#railCyan)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 134 224 L 212 152 L 300 152 L 378 224" fill="none" stroke="#38BDF8" stroke-width="5" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dual Sweeping Kinetic Rails (Lower Track) -->
  <path d="M 104 298 L 206 390 L 306 390 L 408 298" fill="none" stroke="url(#railCyan)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 134 288 L 212 360 L 300 360 L 378 288" fill="none" stroke="#38BDF8" stroke-width="5" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Horizontal High-Speed Settlement Rail Corridors -->
  <line x1="72" y1="256" x2="186" y2="256" stroke="url(#railCyan)" stroke-width="8" stroke-linecap="round" />
  <line x1="326" y1="256" x2="440" y2="256" stroke="url(#railCyan)" stroke-width="8" stroke-linecap="round" />
  <line x1="84" y1="256" x2="168" y2="256" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="344" y1="256" x2="428" y2="256" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Kinetic Hash Markers (Block Confirmation Ticks) -->
  <line x1="172" y1="134" x2="162" y2="144" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
  <line x1="196" y1="112" x2="186" y2="122" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
  <line x1="316" y1="122" x2="326" y2="112" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
  <line x1="340" y1="144" x2="350" y2="134" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
  <line x1="172" y1="378" x2="162" y2="368" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
  <line x1="340" y1="368" x2="350" y2="378" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />

  <!-- Center Guidance Nodes -->
  <circle cx="128" cy="256" r="4" fill="#38BDF8" />
  <circle cx="384" cy="256" r="4" fill="#38BDF8" />

  <!-- Central Stellar Consensus Star (Faceted 4-Point Nova) -->
  <g filter="url(#glow)">
    <!-- North Facet -->
    <polygon points="256,146 256,256 238,256" fill="#FFFFFF" />
    <polygon points="256,146 274,256 256,256" fill="#BAE6FD" />
    <!-- South Facet -->
    <polygon points="256,366 256,256 274,256" fill="#0284C7" />
    <polygon points="256,366 238,256 256,256" fill="#0369A1" />
    <!-- East Facet -->
    <polygon points="366,256 256,256 256,238" fill="#38BDF8" />
    <polygon points="366,256 256,274 256,256" fill="#0284C7" />
    <!-- West Facet -->
    <polygon points="146,256 256,256 256,274" fill="#38BDF8" />
    <polygon points="146,256 256,238 256,256" fill="#FFFFFF" />

    <!-- Center Precision Diamond Core -->
    <polygon points="256,234 278,256 256,278 234,256" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="4" fill="#0284C7" />
  </g>
</svg>