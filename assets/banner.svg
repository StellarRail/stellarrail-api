<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B18" />
      <stop offset="50%" stop-color="#040813" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="railGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="textCyanB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <radialGradient id="meshGlow" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0B132B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <filter id="bFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Outer Frame -->
  <rect x="2" y="2" width="1276" height="356" rx="20" fill="url(#bannerBg)" stroke="url(#bannerBorder)" stroke-width="2" />
  
  <!-- Radial Atmosphere on Right Schematic -->
  <circle cx="960" cy="180" r="280" fill="url(#meshGlow)" />

  <!-- Blueprint Engineering Grid -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" stroke-dasharray="4 6" />
    <line x1="240" y1="0" x2="240" y2="360" stroke-dasharray="4 6" />
    <line x1="480" y1="0" x2="480" y2="360" stroke-dasharray="4 6" />
    <line x1="720" y1="0" x2="720" y2="360" stroke-dasharray="4 6" />
    <line x1="960" y1="0" x2="960" y2="360" stroke-dasharray="4 6" />
    <line x1="1200" y1="0" x2="1200" y2="360" stroke-dasharray="4 6" />
    <line x1="0" y1="90" x2="1280" y2="90" stroke-dasharray="4 6" />
    <line x1="0" y1="180" x2="1280" y2="180" stroke-dasharray="4 6" />
    <line x1="0" y1="270" x2="1280" y2="270" stroke-dasharray="4 6" />
  </g>

  <!-- Left: Logomark + Typography Hero Lockup -->
  <g transform="translate(60, 55)">
    <!-- Logomark Emblem (Scaled to 110x110) -->
    <g transform="translate(0, 0) scale(0.22)">
      <rect x="10" y="10" width="492" height="492" rx="112" fill="#0B132B" stroke="#38BDF8" stroke-width="7" />
      <path d="M 104 214 L 206 122 L 306 122 L 408 214" fill="none" stroke="url(#railGradB)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 104 298 L 206 390 L 306 390 L 408 298" fill="none" stroke="url(#railGradB)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="72" y1="256" x2="186" y2="256" stroke="url(#railGradB)" stroke-width="14" stroke-linecap="round" />
      <line x1="326" y1="256" x2="440" y2="256" stroke="url(#railGradB)" stroke-width="14" stroke-linecap="round" />
      <line x1="84" y1="256" x2="168" y2="256" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <line x1="344" y1="256" x2="428" y2="256" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <g filter="url(#bFilter)">
        <polygon points="256,146 256,256 238,256" fill="#FFFFFF" />
        <polygon points="256,146 274,256 256,256" fill="#BAE6FD" />
        <polygon points="256,366 256,256 274,256" fill="#0284C7" />
        <polygon points="256,366 238,256 256,256" fill="#0369A1" />
        <polygon points="366,256 256,256 256,238" fill="#38BDF8" />
        <polygon points="366,256 256,274 256,256" fill="#0284C7" />
        <polygon points="146,256 256,256 256,274" fill="#38BDF8" />
        <polygon points="146,256 256,238 256,256" fill="#FFFFFF" />
        <polygon points="256,234 278,256 256,278 234,256" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Wordmark & Subtitle -->
    <g transform="translate(135, 12)">
      <!-- System Tag -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="22" rx="11" fill="#0B132B" stroke="#0284C7" stroke-width="1" />
        <circle cx="10" cy="11" r="3" fill="#00E5FF" />
        <text x="20" y="15" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.12em">STELLAR NETWORK</text>
      </g>

      <!-- Main Title -->
      <text y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Space Grotesk', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="0.04em">
        <tspan fill="#FFFFFF">STELLAR</tspan>
        <tspan fill="url(#textCyanB)">RAIL</tspan>
      </text>

      <!-- Specific Subtitle -->
      <text y="86" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="0.1em">
        HIGH-THROUGHPUT ESCROW ORCHESTRATION API
      </text>
    </g>

    <!-- Chips Row -->
    <g transform="translate(0, 150)">
      
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="155" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <circle cx="10" cy="13" r="3" fill="#38BDF8" />
        <text x="18" y="17" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="0.04em">NESTJS 10 // NODE 20</text>
      </g>
    
      <g transform="translate(165, 0)">
        <rect x="0" y="0" width="155" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <circle cx="10" cy="13" r="3" fill="#38BDF8" />
        <text x="18" y="17" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="0.04em">MAKER-CHECKER RBAC</text>
      </g>
    
      <g transform="translate(330, 0)">
        <rect x="0" y="0" width="155" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <circle cx="10" cy="13" r="3" fill="#38BDF8" />
        <text x="18" y="17" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="0.04em">BULLMQ WORKERS</text>
      </g>
    
      <g transform="translate(495, 0)">
        <rect x="0" y="0" width="155" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
        <circle cx="10" cy="13" r="3" fill="#38BDF8" />
        <text x="18" y="17" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="0.04em">KMS MULTISIG SIGNING</text>
      </g>
    
    </g>
  </g>

  <!-- Right: Soroban High-Speed Settlement Schematic -->
  <g transform="translate(730, 45)">
    <!-- Circuit Card Frame -->
    <rect x="0" y="0" width="490" height="270" rx="16" fill="#0A1124" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Schematic Header -->
    <rect x="0" y="0" width="490" height="38" rx="16" fill="#0F172A" />
    <rect x="0" y="24" width="490" height="14" fill="#0F172A" />
    <circle cx="20" cy="19" r="4" fill="#38BDF8" />
    <circle cx="34" cy="19" r="4" fill="#0284C7" />
    <circle cx="48" cy="19" r="4" fill="#1E293B" />
    <text x="68" y="23" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.1em">ORCHESTRATION PIPELINE</text>
    <text x="390" y="23" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">LIVE // VERIFIED</text>

    <!-- Pipeline Stages Nodes -->
    <!-- Node 1: Deposit -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="105" height="68" rx="10" fill="#080E1E" stroke="#0284C7" stroke-width="1.2" />
      <text x="12" y="22" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">STAGE 01</text>
      <text x="12" y="42" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">DEPOSIT</text>
      <text x="12" y="56" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8.5">XLM Locked</text>
    </g>

    <!-- Connect 1 -> 2 -->
    <line x1="135" y1="109" x2="165" y2="109" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="3 3" />
    <polygon points="168,109 161,105 161,113" fill="#38BDF8" />

    <!-- Node 2: Soroban Escrow Engine -->
    <g transform="translate(170, 62)">
      <rect x="0" y="0" width="150" height="94" rx="12" fill="#0C1733" stroke="#00E5FF" stroke-width="1.8" />
      <rect x="8" y="8" width="134" height="20" rx="4" fill="#0284C7" fill-opacity="0.25" />
      <text x="14" y="22" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ESCROW CORE</text>
      <text x="14" y="48" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">SOROBAN WASM</text>
      <text x="14" y="66" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8.5">Maker-Checker Gate</text>
      <text x="14" y="80" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8">Multi-Sig Signer Auth</text>
    </g>

    <!-- Connect 2 -> 3 -->
    <line x1="320" y1="109" x2="350" y2="109" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="3 3" />
    <polygon points="353,109 346,105 346,113" fill="#38BDF8" />

    <!-- Node 3: Settle / Expire -->
    <g transform="translate(355, 75)">
      <rect x="0" y="0" width="105" height="68" rx="10" fill="#080E1E" stroke="#0284C7" stroke-width="1.2" />
      <text x="12" y="22" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">STAGE 03</text>
      <text x="12" y="42" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">SETTLE</text>
      <text x="12" y="56" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="8.5">Released / Refund</text>
    </g>

    <!-- Bottom Telemetry Terminal Stream -->
    <g transform="translate(25, 182)">
      <rect x="0" y="0" width="440" height="68" rx="8" fill="#040711" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="20" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">&gt; soroban ledger :: sequence #49284102 [finalized]</text>
      <text x="14" y="38" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8.5">  auth: SAC Token Contract :: SAC-XLM native balance transfer verified</text>
      <text x="14" y="54" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8.5">  tx_hash: 7f81a9c2...4e01 · replay_protection: deterministic nonce</text>
    </g>
  </g>
</svg>