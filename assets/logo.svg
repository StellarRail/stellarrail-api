<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lockupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F21" />
      <stop offset="50%" stop-color="#050A18" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>

    <linearGradient id="lockupBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="textCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Container (Universal Dark Theme Container for Crisp Display on Light/Dark GitHub) -->
  <rect x="4" y="4" width="952" height="212" rx="24" fill="url(#lockupBg)" stroke="url(#lockupBorder)" stroke-width="2" />
  
  <!-- Subtle Blueprint Tech Lines in Background -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="1">
    <line x1="220" y1="20" x2="220" y2="200" stroke-dasharray="4 4" />
    <line x1="24" y1="110" x2="936" y2="110" stroke-dasharray="4 8" />
    <circle cx="110" cy="110" r="75" stroke-dasharray="3 6" />
  </g>

  <!-- Logomark Emblem at Left (Scaled to 150x150, centered at x=110, y=110) -->
  <g transform="translate(35, 35) scale(0.293)">
    <!-- Base Squircle -->
    <rect x="10" y="10" width="492" height="492" rx="112" fill="#0B132B" stroke="#38BDF8" stroke-width="6" />
    <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />
    
    <!-- Rails -->
    <path d="M 104 214 L 206 122 L 306 122 L 408 214" fill="none" stroke="url(#railGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 134 224 L 212 152 L 300 152 L 378 224" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 104 298 L 206 390 L 306 390 L 408 298" fill="none" stroke="url(#railGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 134 288 L 212 360 L 300 360 L 378 288" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Corridors -->
    <line x1="72" y1="256" x2="186" y2="256" stroke="url(#railGrad)" stroke-width="12" stroke-linecap="round" />
    <line x1="326" y1="256" x2="440" y2="256" stroke="url(#railGrad)" stroke-width="12" stroke-linecap="round" />
    <line x1="84" y1="256" x2="168" y2="256" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="344" y1="256" x2="428" y2="256" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Star -->
    <g filter="url(#logoGlow)">
      <polygon points="256,146 256,256 238,256" fill="#FFFFFF" />
      <polygon points="256,146 274,256 256,256" fill="#BAE6FD" />
      <polygon points="256,366 256,256 274,256" fill="#0284C7" />
      <polygon points="256,366 238,256 256,256" fill="#0369A1" />
      <polygon points="366,256 256,256 256,238" fill="#38BDF8" />
      <polygon points="366,256 256,274 256,256" fill="#0284C7" />
      <polygon points="146,256 256,256 256,274" fill="#38BDF8" />
      <polygon points="146,256 256,238 256,256" fill="#FFFFFF" />
      <polygon points="256,234 278,256 256,278 234,256" fill="#FFFFFF" />
      <circle cx="256" cy="256" r="6" fill="#0284C7" />
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="225" y1="45" x2="225" y2="175" stroke="#1E293B" stroke-width="2" />
  <circle cx="225" cy="110" r="3" fill="#38BDF8" />

  <!-- Right Typography Section -->
  <g transform="translate(255, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="180" height="24" rx="12" fill="#0F172A" stroke="#0284C7" stroke-width="1.2" />
      <circle cx="12" cy="12" r="3.5" fill="#00E5FF" />
      <text x="24" y="16" fill="#38BDF8" font-family="'JetBrains Mono', SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.1em">PAYMENT ORCHESTRATION</text>
    </g>

    <!-- Main Wordmark -->
    <g transform="translate(0, 108)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Space Grotesk', Roboto, sans-serif" font-weight="800" font-size="52" letter-spacing="0.04em">
        <tspan fill="#FFFFFF">STELLAR</tspan>
        <tspan fill="url(#textCyan)">RAIL</tspan>
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(2, 142)">
      <text fill="#94A3B8" font-family="'JetBrains Mono', SFMono-Regular, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.16em">
        ENTERPRISE PAYMENT ORCHESTRATION & SETTLEMENT API
      </text>
    </g>

    <!-- Protocol Specs Minimal Strip -->
    <g transform="translate(2, 172)" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="500">
      <text x="0" y="0">SETTLEMENT FINALITY: &lt;5s</text>
      <text x="170" y="0">|</text>
      <text x="185" y="0">SOROBAN HOST SECURED</text>
      <text x="345" y="0">|</text>
      <text x="360" y="0">ZERO DRIFT RECONCILIATION</text>
    </g>
  </g>
</svg>