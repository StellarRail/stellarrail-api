name: Deploy-Staging
on: { workflow_dispatch: {}, push: { branches: [main] } }
env: { DATABASE_URL: ${{ secrets.DATABASE_URL }}, REDIS_URL: ${{ secrets.REDIS_URL }} }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v4 }
      - { run: echo "Deploy to Fly/Render/ECS via OIDC (no hardcoded creds). Set DATABASE_URL, REDIS_URL, JWT_* secrets in environment." }
