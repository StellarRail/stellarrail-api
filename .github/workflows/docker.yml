name: Docker
on: { push: { branches: [main], tags: ["v*"] } }
jobs:
  build-scan:
    runs-on: ubuntu-latest
    permissions: { packages: write, contents: read }
    steps:
      - { uses: actions/checkout@v4 }
      - { uses: docker/setup-buildx-action@v3 }
      - { uses: docker/login-action@v3, with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} } }
      - { uses: docker/build-push-action@v5, with: { push: false, tags: ghcr.io/org/stellarrail-api:${{ github.sha }}, attestations: provenance } }
      - { uses: aquasecurity/trivy-action@master, with: { image-ref: ghcr.io/org/stellarrail-api:${{ github.sha }}, severity: CRITICAL, exit-code: "1" } }
      - { run: npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script || true }
