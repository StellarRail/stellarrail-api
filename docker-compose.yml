version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: stellar
      POSTGRES_PASSWORD: stellar
      POSTGRES_DB: stellarrail
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: { context: ., dockerfile: Dockerfile.dev }
    ports: ["3000:3000"]
    env_file: [.env]
    depends_on: [postgres, redis]
volumes:
  pgdata: {}
